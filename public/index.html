<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Seguro</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>🔒 Chat Seguro Efêmero</h1>

  <!-- Tela inicial -->
  <div id="telaInicial">
    <fieldset>
      <legend>Criar sala</legend>
      <input id="apelidoCriar" maxlength="20" placeholder="Seu apelido" autocomplete="off">
      <select id="limiteUsos">
        <option value="2">2 entradas</option>
        <option value="3">3 entradas</option>
        <option value="5" selected>5 entradas</option>
        <option value="10">10 entradas</option>
        <option value="20">20 entradas</option>
        <option value="50">50 entradas</option>
      </select>
      <button id="btnCriar">Criar sala</button>
    </fieldset>
    <fieldset>
      <legend>Entrar em uma sala</legend>
      <input id="codigoEntrar" maxlength="22" placeholder="Código da sala (22 caracteres)" size="30" autocomplete="off">
      <input id="apelidoEntrar" maxlength="20" placeholder="Seu apelido" autocomplete="off">
      <button id="btnEntrar">Entrar</button>
    </fieldset>
  </div>

  <!-- Tela do código (após criar a sala) -->
  <div id="telaCodigo" class="hidden">
    <p>✅ Sala criada! Compartilhe este código (válido por 30s até você entrar):</p>
    <p><code id="codigoGerado"></code></p>
    <button id="btnCopiar">📋 Copiar código</button>
    <button id="btnIrChat">Entrar no chat →</button>
  </div>

  <!-- Tela do chat -->
  <div id="telaChat" class="hidden">
    <h3>Membros</h3>
    <ul id="listaMembros"></ul>
    <div id="mensagens"></div>
    <input id="texto" maxlength="1000" placeholder="Sua mensagem..." autocomplete="off">
    <button id="btnEnviar">Enviar</button>
    <button id="btnSair">Sair da sala</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
